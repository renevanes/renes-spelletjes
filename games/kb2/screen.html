<!-- ============ DE DRIE KABOUTERS ============ -->
<section id="kb" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="kbBack" aria-label="Terug">‹</button>
    <div class="kb-hud" id="kbHud"><button class="kb-por" data-g="0" aria-label="Snel"><img alt=""><span class="kb-pi"><span class="kb-h"></span><span class="kb-iv"></span></span></button><button class="kb-por" data-g="1" aria-label="Sterk"><img alt=""><span class="kb-pi"><span class="kb-h"></span><span class="kb-iv"></span></span></button><button class="kb-por" data-g="2" aria-label="Schild"><img alt=""><span class="kb-pi"><span class="kb-h"></span><span class="kb-iv"></span></span></button></div>
    <button class="iconbtn" id="kbRetry" aria-label="Opnieuw">↻</button>
    <button class="iconbtn" id="kbLevelsBtn" aria-label="Levels">☰</button>
  </div>
  <div id="kbWrap"><canvas id="kbCanvas"></canvas>
    <div id="kbInfo"><span id="kbLvName"></span><span id="kbGems"></span><span id="kbTime"></span></div>
    <div id="kbBanner"></div><button id="kbLook" hidden>👁 Terug naar je kabouter</button>
  </div>
  <div id="kbPanel">
    <div class="kb-pad"><button data-act="u" class="u" aria-label="Omhoog">▲</button><button data-act="l" class="l" aria-label="Links">◀</button><button data-act="r" class="r" aria-label="Rechts">▶</button><button data-act="d" class="d" aria-label="Omlaag">▼</button></div>
    <div id="kbInv"><div class="kb-slots"><button data-s="0"></button><button data-s="1"></button><button data-s="2"></button><button data-s="3"></button></div><div class="kb-ib"><small id="kbInvName"></small><div><button id="kbUse">Gebruik</button><button id="kbGive">Geef</button></div></div></div>
    <div class="kb-btns"><button data-act="s" class="sw" aria-label="Wissel van kabouter"><b>⇄</b><small>Wissel</small></button><button data-act="x" class="ac" aria-label="Actie"><b>✋</b><small>Actie</small></button><button data-act="b" class="bb" id="kbB" aria-label="Vaardigheid 2"></button><button data-act="a" class="aa" id="kbA" aria-label="Vaardigheid 1"></button></div>
  </div>
</section>
