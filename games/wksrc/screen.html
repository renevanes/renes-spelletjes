<!-- ============ WOEF TEGEN KAREL ============ -->
<section id="wk" class="screen">
  <div id="wkStage">
    <canvas id="wkCv"></canvas>
    <div id="wkTop">
      <button id="wkPause" aria-label="Pauze">❚❚</button>
      <div id="wkTitle"></div>
      <div id="wkStars" aria-label="Sterren"></div>
    </div>
    <div id="wkSide">
      <button id="wkHintBtn" aria-label="Hint"><b>💡</b><small>Hint</small></button>
      <button id="wkBark" aria-label="Blaf"><b>🐶</b><small>Blaf!</small></button>
      <div id="wkInv" aria-label="Rugzak"></div>
    </div>
    <div id="wkMsg" aria-live="polite"></div>
    <div id="wkCu"></div>
    <div id="wkIntro"></div>
    <div id="wkMap" class="wk-view">
      <div class="wk-map-top"><button id="wkMapBack" class="wk-x" aria-label="Terug">‹</button><h2>Kies een machine</h2><span id="wkMapSum"></span></div>
      <div id="wkWorlds" class="wk-worlds"></div>
      <div id="wkMapBox"></div>
    </div>
    <div id="wkToast"></div>
  </div>
</section>
