<!-- ============ LOGIGRAM ============ -->
<section id="lg" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="lgBack" aria-label="Terug">‹</button>
    <div class="lg-head"><b id="lgTitle">Logigram</b><span class="lg-pill">⏱ <b id="lgTime">0:00</b></span></div>
    <button class="iconbtn" id="lgMenu" aria-label="Menu">☰</button>
  </div>
  <div id="lgMain">
    <div id="lgBox"><canvas id="lgCv"></canvas><div id="lgPulse"></div>
      <div id="lgToast"></div>
      <div id="lgBusy"><div class="lg-spin"></div><b>Puzzel maken…</b></div>
    </div>
    <div id="lgSide">
      <div id="lgTools">
        <button data-b="undo" id="lgUndo"><b>↶</b><small>Terug</small></button>
        <button data-b="redo" id="lgRedo"><b>↷</b><small>Vooruit</small></button>
        <button data-b="pen" id="lgPen" hidden><b>✓</b><small>Teken</small></button>
        <button data-b="fit" id="lgFit"><b>⤢</b><small>Passend</small></button>
        <button data-b="check" id="lgCheck"><b>☑</b><small>Controleer</small></button>
        <button data-b="hint" id="lgHintB"><b>💡</b><small>Hint</small></button>
      </div>
      <div id="lgTabs"><button data-t="c" id="lgTabC" class="on">Aanwijzingen</button><button data-t="s">Overzicht</button></div>
      <div id="lgPanel"><ol id="lgClues"></ol><div id="lgSum" hidden></div></div>
      <div id="lgTip"><p id="lgTipText"></p><div class="lg-tipb"><button id="lgTipX" aria-label="Sluiten">Sluiten</button><button id="lgTipGo" class="go">Zet ✓</button></div></div>
    </div>
  </div>
</section>
