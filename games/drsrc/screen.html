<!-- ============ DAKRENNER ============ -->
<section id="dr" class="screen">
  <div id="drStage">
    <canvas id="drCv"></canvas>
    <div id="drHud" aria-hidden="true">
      <div class="drh-top"><div class="drh-time"><b id="drTime">0:00.0</b><small id="drGoal"></small></div></div>
      <div class="drh-right"><span id="drShoes"></span><span id="drFlags"></span></div>
      <div id="drTricks"></div>
      <div id="drHint"><i></i><span></span></div>
    </div>
    <div id="drPad" aria-hidden="true"></div>
    <button id="drPause" aria-label="Pauze">❚❚</button>
    <div id="drLv" class="dr-view">
      <div class="dr-lv-top"><button id="drLvBack" class="dr-x" aria-label="Terug">‹</button><h2>Kies een level</h2><span id="drLvSum"></span></div>
      <div id="drWorlds" class="dr-worlds"></div>
      <div id="drLvGrid" class="dr-lv-grid"></div>
    </div>
    <div id="drRot" class="dr-rot"><div><div class="dr-phone">📱</div><b>Draai je telefoon</b><p>Dakrenner speel je met je telefoon dwars.</p><button class="btn" id="drRotBack">Terug naar de levels</button></div></div>
    <div id="drToast"></div>
  </div>
</section>
