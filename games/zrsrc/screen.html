<!-- ============ ZANDRIJK ============ -->
<section id="zr" class="screen">
  <div id="zrWrap">
    <div id="zrStage">
      <canvas id="zrBg"></canvas>
      <canvas id="zrCv"></canvas>
      <canvas id="zrFog"></canvas>
      <canvas id="zrOv"></canvas>
      <div id="zrTop" aria-live="polite">
        <button id="zrPause" class="zr-round" aria-label="Pauze">❚❚</button>
        <div id="zrRes"><span id="zrCry" class="zr-chip"><i class="zr-gem"></i><b>0</b></span><span id="zrPow" class="zr-chip"><i>⚡</i><span class="zr-pbar"><em></em></span><b>0</b></span></div>
        <div id="zrObj" class="zr-chip"></div>
      </div>
      <div id="zrToasts"></div>
      <div id="zrSelInfo"></div>
      <div id="zrCmd">
        <button id="zrBox" class="zr-c" aria-label="Selecteer met een kader"><i>⬚</i><small>Selecteer</small></button>
        <button id="zrGroup1" class="zr-c zr-g" data-g="0"><i>1</i><small>Groep</small><em></em></button>
        <button id="zrGroup2" class="zr-c zr-g" data-g="1"><i>2</i><small>Groep</small><em></em></button>
        <button id="zrGroup3" class="zr-c zr-g" data-g="2"><i>3</i><small>Groep</small><em></em></button>
        <button id="zrStop" class="zr-c zr-u" aria-label="Stop"><i>■</i><small>Stop</small></button>
        <button id="zrRep" class="zr-c zr-b" aria-label="Repareren"><i>🔧</i><small>Repareer</small></button>
        <button id="zrSell" class="zr-c zr-b" aria-label="Verkopen"><i>💰</i><small>Verkoop</small></button>
        <button id="zrRally" class="zr-c zr-b" aria-label="Verzamelpunt"><i>🚩</i><small>Verzamel</small></button>
        <button id="zrDesel" class="zr-c zr-s" aria-label="Niets selecteren"><i>✕</i><small>Los</small></button>
        <button id="zrAll" class="zr-c zr-atk" aria-label="Alles aanvallen"><i>⚔️</i><small>Alles aanvallen</small></button>
      </div>
      <div id="zrPlace"><span id="zrPlaceTxt"></span><button id="zrPlaceNo" class="zr-c" aria-label="Annuleren"><i>✕</i></button><button id="zrPlaceOk" class="zr-c zr-ok"><i>✓</i><small>Plaatsen</small></button></div>
    </div>
    <div id="zrSide">
      <div id="zrMiniBox"><canvas id="zrMini"></canvas><span id="zrNoRadar">📡<br>Bouw een radar<br>voor het kaartje</span></div>
      <div id="zrTabs"><button data-tab="b"><i>🏗️</i><small>Bouwen</small><em></em></button><button data-tab="i"><i>🪖</i><small>Soldaten</small><em></em></button><button data-tab="v"><i>🚙</i><small>Voertuigen</small><em></em></button></div>
      <div id="zrBuild"></div>
    </div>
  </div>
</section>
